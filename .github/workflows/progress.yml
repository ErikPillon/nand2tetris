name: progress

# Re-measures the journey on every push and commits the result, which is what
# makes the website update itself. Pushes made with GITHUB_TOKEN do not retrigger
# workflows, so this cannot loop.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: progress
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --quiet pytest hypothesis

      - name: Measure progress
        run: python tools/emit_progress.py

      - name: Commit if anything changed
        run: |
          git config user.name  "progress bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/progress.json
          if git diff --quiet --cached; then
            echo "No change in progress; nothing to commit."
          else
            git commit -m "chore: refresh progress [skip ci]"
            git push
          fi
