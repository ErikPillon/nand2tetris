; pytest configuration.
;
; This deliberately lives in pytest.ini rather than pyproject.toml: a
; pyproject.toml at the repository root makes Vercel classify the project as a
; Python web app and hunt for a WSGI entrypoint instead of serving site/.
; Nothing here is installed as a package, so pyproject.toml bought us nothing.

[pytest]
testpaths = tests
pythonpath = .
addopts = -q --tb=short --import-mode=importlib -m 'not optimal'
markers =
    optimal: stretch goal -- the chip hits the minimal NAND count (run with: n2t optimal)
    slow: exhaustive sweeps over large input spaces
