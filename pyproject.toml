[project]
name = "nand2tetris"
version = "0.1.0"
description = "Building a modern computer from first principles, in Python, test-first."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short --import-mode=importlib -m 'not optimal'"
markers = [
  "optimal: stretch goal -- the chip hits the minimal NAND count (run with: n2t optimal)",
  "slow: exhaustive sweeps over large input spaces",
]
